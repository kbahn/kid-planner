name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secrets에 KEYSTORE_BASE64가 없어요 (README 참고)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/planner.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/planner.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          echo "VCODE=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk kid-planner-v1.1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kid-planner-apk
          path: "*.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.VCODE }}
          name: 일정 체크 v1.1.${{ github.run_number }}
          body: 앱의 ⚙ 설정 → 앱 업데이트에서 받거나, 아래 APK를 받아 기존 앱 위에 설치하세요.
          files: "*.apk"
          make_latest: true
